{% extends "base.html" %}
{% block body %}
<h1>Books</h1>
<form>
  <input name="title" placeholder="Title" value="{{ args.title }}">
  <input name="author" placeholder="Author" value="{{ args.author }}">
  <select name="genre">
    <option value="">Any genre</option>
    {% for g in genres %}<option {% if g.genre == args.genre %}selected{% endif %}>{{ g.genre }}</option>{% endfor %}
  </select>
  <button>Search</button>
</form>
<p><a href="{{ url_for('new_book') }}">Add a missing book</a></p>
<ul>
  {% for b in books %}
    <li><a href="{{ url_for('book', isbn=b.isbn) }}">{{ b.title }}</a> ({{ b.pubyear or '?' }}) {{ b.genre or '' }}</li>
  {% else %}
    <li>No books found.</li>
  {% endfor %}
</ul>
{% endblock %}
